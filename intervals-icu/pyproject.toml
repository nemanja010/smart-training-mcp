[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intervals-icu-mcp"
version = "1.0.0"
description = "Full-coverage MCP server for Intervals.icu — read, upload, and plan training with Claude"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
  "mcp[cli]>=1.4.0",
  "httpx>=0.25.0",
  "python-dotenv>=1.0.0",
]
keywords = ["intervals", "cycling", "running", "training", "mcp", "ai", "coaching"]

[project.scripts]
intervals-mcp = "intervals_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B"]
ignore = ["E501", "B008", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
